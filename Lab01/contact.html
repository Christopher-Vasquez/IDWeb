    <article>
      <h2>Escríbeme</h2>
      <p>Este formulario es solo una demostración visual; no envía datos a ningún servidor.</p>

      <form>
        <p>
          <label for="nombre">Nombre:</label><br>
          <input type="text" id="nombre" name="nombre" placeholder="Tu nombre">
        </p>
        <p>
          <label for="correo">Correo electrónico:</label><br>
          <input type="email" id="correo" name="correo" placeholder="tucorreo@ejemplo.com">
        </p>
        <p>
          <label for="mensaje">Mensaje:</label><br>
          <textarea id="mensaje" name="mensaje" rows="5" placeholder="Escribe tu mensaje aquí"></textarea>
        </p>
        <p>
          <button type="submit">Enviar</button>
        </p>
      </form>
    </article>
