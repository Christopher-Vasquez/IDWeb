<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de Tareas Universitarias</title>
  <!-- Bootstrap 5 (CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="bg-primary text-white text-center py-3">
    <h1 class="h3 mb-0">Gestor de Tareas Universitarias</h1>
  </header>
  <main class="container py-4">
    <!-- Formulario de alta -->
    <section class="card p-3 mb-4">
      <h2 class="h5">Nueva tarea</h2>
      <!-- Alertas dinámicas (se llenan desde JavaScript) -->
      <div id="alertas" aria-live="polite"></div>
      <form id="form-tarea" novalidate>
        <div class="row g-3">
          <div class="col-12 col-md-4">
            <label for="titulo" class="form-label">Título</label>
            <input type="text" id="titulo" class="form-control" placeholder="Ej. Informe Lab 04">
          </div>
          <div class="col-12 col-md-4">
            <label for="curso" class="form-label">Curso</label>
            <input type="text" id="curso" class="form-control" placeholder="Ej. Desarrollo Web">
          </div>
          <div class="col-12 col-md-4">
            <label for="fecha" class="form-label">Fecha de entrega</label>
            <input type="date" id="fecha" class="form-control">
          </div>
        </div>
        <button type="submit" class="btn btn-primary mt-3">Agregar tarea</button>
      </form>
    </section>
    <!-- Filtros y contador -->
    <section class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
      <div class="btn-group" id="filtros" role="group" aria-label="Filtros de tareas">
        <button type="button" class="btn btn-outline-primary active" data-filtro="todas">Todas</button>
        <button type="button" class="btn btn-outline-primary" data-filtro="pendientes">Pendientes</button>
        <button type="button" class="btn btn-outline-primary" data-filtro="completadas">Completadas</button>
      </div>
      <p id="contador" class="mb-0 text-muted"></p>
    </section>
    <!-- Lista de tareas -->
    <section>
      <ul id="lista-tareas" class="list-group"></ul>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
